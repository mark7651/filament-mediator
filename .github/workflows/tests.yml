name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The package itself runs on 8.3, but Pest 5 asks for 8.4, so the run
        # starts where the tests can be run at all.
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the tests
        run: vendor/bin/pest

      - name: Check the formatting
        run: vendor/bin/pint --test
